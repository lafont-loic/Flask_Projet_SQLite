<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Portail Apps</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9; }
        .container { text-align: center; }
        .card-container { display: flex; gap: 20px; margin-top: 30px; }
        .card { 
            background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 250px; text-decoration: none; color: #333; transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-5px); }
        .card h2 { color: #2c3e50; }
        .btn { display: inline-block; margin-top: 15px; padding: 10px 20px; background: #3498db; color: white; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bienvenue sur mon GitHub</h1>
        <p>Veuillez choisir l'application que vous souhaitez utiliser :</p>
        
        <div class="card-container">
            <a href="{{ url_for('hello_world') }}" class="card">
                <h2>📚 Bibliothèque</h2>
                <p>Gérer les livres, les clients et les emprunts.</p>
                <div class="btn">Accéder</div>
            </a>

            <a href="{{ url_for('dashboard_tasks') }}" class="card">
                <h2>✅ Mes Tâches</h2>
                <p>Organiser votre dashboard et gérer vos missions.</p>
                <div class="btn">Accéder</div>
            </a>
        </div>
    </div>
</body>
</html>
